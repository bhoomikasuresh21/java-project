<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student Attendance Calculator</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="page">
    <section class="calculator" aria-labelledby="app-title">
      <header class="header">
        <h1 id="app-title">Student Attendance Calculator</h1>
        <p class="subtitle">Calculate your attendance and remaining leave allowance</p>
      </header>

      <section class="input-section" aria-label="Attendance inputs">
        <div class="input-grid">
          <div class="field">
            <label for="totalClasses">Total Classes</label>
            <input type="number" id="totalClasses" name="totalClasses" inputmode="numeric" min="1" step="1" placeholder="e.g. 100">
          </div>
          <div class="field">
            <label for="absentClasses">Absent Classes</label>
            <input type="number" id="absentClasses" name="absentClasses" inputmode="numeric" min="0" step="1" placeholder="e.g. 20">
          </div>
        </div>
        <div class="actions">
          <button type="button" id="calculateBtn" class="btn btn-primary">Calculate Attendance</button>
          <button type="button" id="clearBtn" class="btn btn-secondary">Clear</button>
        </div>
        <p id="statusMessage" class="status-message" aria-live="polite"></p>
      </section>

      <section class="results-section" aria-label="Attendance results">
        <div class="results-grid">
          <article class="card">
            <h2 class="card-label">Attended Classes</h2>
            <p id="attendedResult" class="card-value">-</p>
          </article>
          <article class="card">
            <h2 class="card-label">Absent Classes</h2>
            <p id="absentResult" class="card-value">-</p>
          </article>
          <article class="card card-highlight">
            <h2 class="card-label">Attendance Percentage</h2>
            <p id="percentageResult" class="card-value percentage-value">-</p>
          </article>
          <article class="card">
            <h2 class="card-label">Additional Leaves Allowed</h2>
            <p id="leavesResult" class="card-value">-</p>
          </article>
        </div>
      </section>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
